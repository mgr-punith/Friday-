name: Credential check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check credential scanner regressions
        run: python3 -m unittest discover -s scripts -p 'test_check_secrets.py'

      - name: Scan committed history
        run: python3 scripts/check-secrets.py --history HEAD
